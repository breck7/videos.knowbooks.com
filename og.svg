<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="ogTitle ogDesc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
 <title id="ogTitle">Knowbooks Videos</title>
 <desc id="ogDesc">Knowbooks videos. For entertainment purposes only.</desc>

 <defs>
  <radialGradient id="glowBlue" cx="12%" cy="-12%" r="70%">
   <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.16"/>
   <stop offset="0.6" stop-color="#7cc4ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowViolet" cx="100%" cy="0%" r="72%">
   <stop offset="0" stop-color="#b388ff" stop-opacity="0.15"/>
   <stop offset="0.58" stop-color="#b388ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
   <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.22"/>
   <stop offset="0.55" stop-color="#b388ff" stop-opacity="0.08"/>
   <stop offset="1" stop-color="#b388ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0.9">
   <stop offset="0.05" stop-color="#ffffff"/>
   <stop offset="0.52" stop-color="#a9c7ff"/>
   <stop offset="0.95" stop-color="#c9b3ff"/>
  </linearGradient>
  <linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#06090d" stop-opacity="0"/>
   <stop offset="0.5" stop-color="#06090d" stop-opacity="0.04"/>
   <stop offset="1" stop-color="#06090d" stop-opacity="0.86"/>
  </linearGradient>
  <linearGradient id="cardSheen" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
   <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="frontClip"><rect x="632" y="172" width="512" height="288" rx="18"/></clipPath>
  <clipPath id="backClip"><rect x="700" y="150" width="470" height="264" rx="16"/></clipPath>
  <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="210%">
   <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#000000" flood-opacity="0.62"/>
  </filter>

  <!-- Knowbooks mark: a ring supported by two hands (gold) -->
  <g id="kbMark" fill="#d9bc78">
   <path fill-rule="evenodd" d="M128 14C68.45 14 20 62.45 20 122c0 18.12 4.5 35.2 12.42 50.2l12.37-7.15A93.28 93.28 0 0 1 34.3 122c0-51.67 42.03-93.7 93.7-93.7s93.7 42.03 93.7 93.7a93.28 93.28 0 0 1-10.49 43.05l12.37 7.15A107.42 107.42 0 0 0 236 122c0-59.55-48.45-108-108-108Z"/>
   <path d="M29.31 156.42c-4.34-7.23-3.66-13.77.07-15.84 3.38-1.87 7.33.31 10.53 4.4l22.82 25.16c1.12 1.24 2.85-.31 1.88-1.66l-19.1-26.67c-3.67-5.13-3.33-10.19.2-12.41 3.77-2.38 8.54.65 12.52 5.26l18.1 20.97c3.7 4.29 8.36 7.65 12.05 12.6 5.96 7.99 6.08 19.48 6.08 31.36v25.99c-24.1-2.86-43.02-12.51-53.85-26.48-7.38-9.52-8.76-23.53-11.3-42.68Z"/>
   <path d="M226.69 156.42c4.34-7.23 3.66-13.77-.07-15.84-3.38-1.87-7.33.31-10.53 4.4l-22.82 25.16c-1.12 1.24-2.85-.31-1.88-1.66l19.1-26.67c3.67-5.13 3.33-10.19-.2-12.41-3.77-2.38-8.54.65-12.52 5.26l-18.1 20.97c-3.7 4.29-8.36 7.65-12.05 12.6-5.96 7.99-6.08 19.48-6.08 31.36v25.99c24.1-2.86 43.02-12.51 53.85-26.48 7.38-9.52 8.76-23.53 11.3-42.68Z"/>
  </g>
 </defs>

 <!-- Backdrop -->
 <rect width="1200" height="630" fill="#0a0d12"/>
 <rect width="1200" height="630" fill="url(#glowBlue)"/>
 <rect width="1200" height="630" fill="url(#glowViolet)"/>

 <!-- Header: brand + section -->
 <g transform="translate(76 62) scale(0.203125)">
  <use href="#kbMark"/>
 </g>
 <text x="144" y="97" font-size="19" font-weight="700" letter-spacing="4.6" fill="#e8eef6">KNOWBOOKS</text>
 <line x1="322" y1="76" x2="322" y2="104" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
 <text x="344" y="97" font-size="19" font-weight="700" letter-spacing="4.6" fill="#7cc4ff">VIDEOS</text>

 <!-- Headline -->
 <text x="72" y="356" font-size="150" font-weight="700" letter-spacing="-6" fill="url(#titleFill)">Videos</text>
 <text x="78" y="418" font-size="27" fill="#8b98a9">For entertainment purposes only.</text>

 <!-- Domain pill -->
 <g>
  <rect x="76" y="492" width="264" height="52" rx="26" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.13)" stroke-width="1.5"/>
  <circle cx="104" cy="518" r="4.5" fill="#d9bc78"/>
  <text x="126" y="526" font-size="19" letter-spacing="0.4" fill="#7cc4ff">videos.knowbooks.com</text>
 </g>

 <!-- Stage: floating player card -->
 <ellipse cx="888" cy="316" rx="380" ry="280" fill="url(#stageGlow)"/>

 <!-- Back card -->
 <g transform="rotate(5 900 300)" opacity="0.42">
  <rect x="700" y="150" width="470" height="264" rx="16" fill="#121924" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <image clip-path="url(#backClip)" x="700" y="150" width="470" height="264" preserveAspectRatio="xMidYMid slice" href="posters/launchDay.jpg"/>
 </g>

 <!-- Front card: fireplace still with play control -->
 <g transform="rotate(-3 888 316)" filter="url(#cardShadow)">
  <g clip-path="url(#frontClip)">
   <image x="632" y="172" width="512" height="288" preserveAspectRatio="xMidYMid slice" transform="translate(888 316) scale(1.07) translate(-888 -316)" href="posters/fireplace-small.jpg"/>
   <rect x="632" y="172" width="512" height="288" fill="url(#cardFade)"/>
   <rect x="632" y="172" width="512" height="288" fill="url(#cardSheen)"/>
  </g>
  <rect x="632.75" y="172.75" width="510.5" height="286.5" rx="17.5" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
  <!-- play button -->
  <g transform="translate(888 316)">
   <circle r="48" fill="rgba(10,13,18,0.52)" stroke="rgba(255,255,255,0.34)" stroke-width="1.5"/>
   <path d="M-12 -19 L23 0 L-12 19 Z" fill="#ffffff"/>
  </g>
  <!-- duration chip -->
  <g transform="translate(1068 414)">
   <rect width="60" height="30" rx="7" fill="rgba(6,9,13,0.82)"/>
   <text x="30" y="20" text-anchor="middle" font-size="15" fill="#dfe8f3">10:11</text>
  </g>
 </g>
</svg>
